name: Actualizar noticias diarias

on:
  schedule:
    # 11:00 UTC = 06:00 en Ecuador (UTC-5), de lunes a viernes
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Recolectar noticias
        run: npm run fetch:news

      - name: Commit de data/news.json
        run: |
          git config user.name "corenews-bot"
          git config user.email "corenews-bot@users.noreply.github.com"
          if git diff --quiet -- data/news.json; then
            echo "Sin cambios en las noticias."
            exit 0
          fi
          git add data/news.json
          git commit -m "chore(news): actualización automática de noticias"
          git push
